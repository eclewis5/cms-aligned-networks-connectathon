name: "Share results"
description: "Share what you tested at the connectathon and what you found"
title: "[Result] "
labels: ["result"]
body:
  - type: markdown
    attributes:
      value: |
        Results are public. A failure is as useful as a pass. Submit one form per scenario run, or per scenario if you ran it with several partners. Use synthetic data only.
  - type: input
    id: name
    attributes:
      label: "Your name"
      description: "Shown publicly with your result."
    validations:
      required: true
  - type: input
    id: org
    attributes:
      label: "Organization"
      description: "Your organization's name."
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: "Role you played"
      description: "What you were testing as."
      options:
        - "Network"
        - "Provider"
        - "EHR vendor"
        - "Payer"
        - "Patient-facing app"
        - "Observer or other"
    validations:
      required: true
  - type: checkboxes
    id: scenarios
    attributes:
      label: "Scenarios you tested"
      description: "Scenarios are described on the Scenarios page. Pick every one this report covers."
      options:
        - label: "N1 Patient matching"
        - label: "N2 Purpose of Use handling"
        - label: "N3 Dynamic Client Registration"
        - label: "N4 Data querying, structured and unstructured"
        - label: "N5 Audit logging"
        - label: "A1 Record location (RLS)"
        - label: "A2 National Provider Directory publishing and usage metrics"
        - label: "A3 Response for patient, provider, and payer use cases"
        - label: "A4 Honoring disclosure restrictions"
        - label: "A5 Intranetwork query (Pathway 1)"
        - label: "A6 Targeted query against an NPD endpoint (Pathway 3)"
        - label: "A7 Presumptive eligibility and suspension"
  - type: input
    id: counterparts
    attributes:
      label: "Who you tested with"
      description: "The networks or components on the other side, and which side started the request."
      placeholder: "Example Network (responder)"
    validations:
      required: false
  - type: dropdown
    id: outcome
    attributes:
      label: "Overall outcome"
      options:
        - "Passed"
        - "Partly passed"
        - "Failed"
        - "Could not run"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "What happened"
      description: "What you tried, what worked, what failed, and the cause if you know it. Say which pass criteria you met."
    validations:
      required: true
  - type: textarea
    id: recommendations
    attributes:
      label: "Recommendations"
      description: "What you would change in the requirements, the test tools, or the event. Mention any unclear or hard-to-implement requirement."
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence"
      description: "Screenshots, or a request and response. Synthetic data only, and remove tokens and secrets."
    validations:
      required: false
  - type: checkboxes
    id: ack
    attributes:
      label: "Before you submit"
      description: "This issue is public."
      options:
        - label: "This report contains no real health information, credentials, tokens, or secrets."
          required: true
